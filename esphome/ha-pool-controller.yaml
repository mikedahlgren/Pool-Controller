# Home Assistant ESPHome Builder — copy THIS FILE ONLY into /config/esphome/
#
# Do not upload the rest of the GitHub repo. At compile time ESPHome pulls
# the C++ components and YAML packages from GitHub.
#
# Setup:
#   1. Push your fork (filter pressure + acid/pH included) to GitHub.
#   2. In ESPHome Builder: New device → Edit → replace the stub with this file.
#   3. Add the keys from secrets.yaml.example to Home Assistant's
#      /config/esphome/secrets.yaml (wifi keys are usually already there).
#   4. Install / wirelessly update.
#
# After that, firmware updates are: edit this one file if needed, then Install.
# Leave refresh: 0s on external_components and packages so every compile
# pulls GitHub (do not use 1d while iterating; it caches yesterday's C++).
#
# PoolVeras (Sync to the Cloud, Last cloud sync, and the hourly pH and
# water-temperature post) is written in this file, in the PoolVeras section
# below. It is the first group on http://pool-controller.local.
# secrets.yaml must contain poolvera_authorization or Install fails.
#
# Device UI is ESPHome web_server v3 at http://pool-controller.local
# plus Home Assistant.
#
# Private repo: replace the github:// lines with type: git, url, username,
# and password: !secret github_token (a PAT with repo read access).

substitutions:
  waterfall_pin: GPIO1
  one_wire_pin: GPIO10
  air_temp_id: !secret air_temp_id
  water_temp_id: !secret water_temp_id
  pentair_tx_pin: GPIO17
  pentair_rx_pin: GPIO18
  right_arrow: "➡️"
  pentair_light_pin: GPIO46
  filter_pressure_pin: GPIO4
  filter_pressure_shunt_ohms: "150.0"
  filter_pressure_full_scale_mpa: "0.5"
  acid_pump_pin: GPIO2          # Stenner 45M5 hot on CH2
  ph_sensor_pin: GPIO5          # Atlas KIT-102P 4-20mA + (Pico GP5 / pin 7)
  ph_shunt_ohms: "150.0"        # Dedicated 150Ω; not the Yosoo shunt; not 250Ω
  ph_scale_low: "0"             # Atlas IND-pH: 4 mA = 0 pH
  ph_scale_high: "14"           # Atlas IND-pH: 20 mA = 14 pH
  ph_offset: "0.2"              # Trim ESP/HA vs Atlas display (ESP was ~0.2 low)
  ph_update_interval: "5s"      # ADC + Pool pH poll; pH Loop Current follows voltage
  acid_pump_gpd: "25"           # Stenner output at dial 10 while CH2 is on (25 GPD model)
  # The pool Settings page shows this key. Paste it as shown.
  poolvera_authorization: !secret poolvera_authorization

esphome:
  name: pool-controller
  friendly_name: Pool Controller
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  # Device log body colors (ESPHome Builder / HA): yellow ESP→pump, cyan pump→ESP,
  # blue temp, magenta filter, green pH/acid, white schedule/lights.
  logs:
    dallas.temp.sensor: WARN

api:
  encryption:
    key: !secret pool_controller_api_key

ota:
  - platform: esphome
    id: my_ota
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Pool Controller Hotspot"
    password: !secret ap_password

captive_portal:

external_components:
  - source: github://mikedahlgren/Pool-Controller@main
    components: [pentair_if_ic]
    refresh: 0s

web_server:
  port: 80
  version: 3
  ota: false
  sorting_groups:
    - id: sorting_group_poolvera
      name: "PoolVeras"
      sorting_weight: -40
    - id: sorting_group_diagnostics
      name: "Diagnostics"
      sorting_weight: -1

packages:
  pool_firmware:
    url: https://github.com/mikedahlgren/Pool-Controller
    ref: main
    refresh: 0s
    files:
      - esphome/Include/temperature.yaml
      - esphome/Include/schedule.yaml
      - esphome/Include/pentair_light.yaml
      - esphome/Include/filter_pressure.yaml
      - esphome/Include/acid_ph.yaml
      # Uncomment if you add an IntelliChlor-compatible SWG, and set
      # enable_intellichlor: true in esphome/Include/schedule.yaml:
      # - esphome/Include/chlorinator.yaml

# PoolVeras — this section is in this file on purpose. The device page shows it
# as the first group, "PoolVeras", with Sync to the Cloud and Last cloud sync.
# The post stores pH, water temperature, and the controller's local date.
# The site overview keeps the last kit reading for anything left out.
# secrets.yaml needs:
#   poolvera_authorization: "pt_..."
# Install fails until that line exists.

http_request:
  verify_ssl: true

text_sensor:
  - platform: template
    name: "Last cloud sync"
    id: poolvera_status
    icon: "mdi:cloud-check"
    web_server:
      sorting_group_id: sorting_group_poolvera
      sorting_weight: 2

script:
  - id: poolvera_post
    mode: single
    then:
      - lambda: |-
          id(poolvera_status).publish_state("Syncing");
      - delay: 1ms
      - if:
          condition:
            lambda: |-
              return !isnan(id(pool_ph).state) || !isnan(id(water_temperature).state);
          then:
            - logger.log:
                tag: poolvera
                format: "PoolVeras sync starting"
            - http_request.post:
                url: https://poolveras.com/api/device/readings
                request_headers:
                  Content-Type: application/json
                  Authorization: !lambda |-
                    static std::string header;
                    const std::string key = "${poolvera_authorization}";
                    if (key.size() >= 7 && (key.compare(0, 7, "Bearer ") == 0 || key.compare(0, 7, "bearer ") == 0)) header = key;
                    else header = "Bearer " + key;
                    return header.c_str();
                json: |-
                  if (!isnan(id(pool_ph).state)) root["ph"] = id(pool_ph).state;
                  if (!isnan(id(water_temperature).state)) root["tempF"] = id(water_temperature).state;
                  root["timeLabel"] = "controller";
                  auto clock = id(homeassistant_time).now();
                  if (clock.year >= 2024) {
                    char date_buf[11];
                    snprintf(date_buf, sizeof(date_buf), "%04d-%02d-%02d", (int) clock.year, (int) clock.month, (int) clock.day_of_month);
                    root["testedOn"] = date_buf;
                    root["unix"] = (double) clock.timestamp;
                  }
                on_response:
                  then:
                    - lambda: |-
                        std::string text = "HTTP " + std::to_string(response->status_code);
                        auto clock = id(homeassistant_time).now();
                        if (clock.year >= 2024) {
                          char when[9];
                          snprintf(when, sizeof(when), "%02d:%02d ", (int) clock.hour, (int) clock.minute);
                          text = std::string(when) + text;
                        }
                        id(poolvera_status).publish_state(text);
                on_error:
                  then:
                    - lambda: |-
                        id(poolvera_status).publish_state("Could not reach the site");
          else:
            - lambda: |-
                id(poolvera_status).publish_state("No pH or temperature");
            - logger.log:
                level: WARN
                tag: poolvera
                format: "PoolVeras sync skipped: pH and water temperature are unavailable"

button:
  - platform: template
    name: "Sync to the Cloud"
    id: poolvera_sync
    icon: "mdi:cloud-upload"
    on_press:
      - lambda: |-
          id(poolvera_post).execute();
    web_server:
      sorting_group_id: sorting_group_poolvera
      sorting_weight: 1

interval:
  - interval: 60min
    then:
      - lambda: |-
          id(poolvera_post).execute();

switch:
  - platform: factory_reset
    name: Factory Reset
    web_server:
      sorting_group_id: sorting_group_diagnostics
      sorting_weight: 6
