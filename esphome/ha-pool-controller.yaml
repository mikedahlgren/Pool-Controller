# Home Assistant ESPHome Builder — copy THIS FILE ONLY into /config/esphome/
#
# Do not upload the rest of the GitHub repo. At compile time ESPHome pulls
# the C++ components and YAML packages from GitHub.
#
# Setup:
#   1. Push your fork (filter pressure + acid/pH included) to GitHub.
#   2. In ESPHome Builder: New device → Edit → replace the stub with this file.
#   3. Add the keys from secrets.yaml.example to Home Assistant's
#      /config/esphome/secrets.yaml (wifi keys are usually already there).
#   4. Install / wirelessly update.
#
# After that, firmware updates are: edit this one file if needed, then Install.
# Leave refresh: 0s on external_components and packages so every compile
# pulls GitHub (do not use 1d while iterating; it caches yesterday's C++).
#
# PoolVeras (Sync to the Cloud, Last cloud sync, and the hourly pH and
# water-temperature post) is esphome/Include/poolveras.yaml, pulled from
# GitHub with the other packages. It is the first group on
# http://pool-controller.local.
# secrets.yaml must contain poolveras_authorization or Install fails.
#
# Device UI is ESPHome web_server v3 at http://pool-controller.local
# plus Home Assistant.
#
# Private repo: replace the github:// lines with type: git, url, username,
# and password: !secret github_token (a PAT with repo read access).

substitutions:
  waterfall_pin: GPIO1
  one_wire_pin: GPIO37
  air_temp_id: !secret air_temp_id
  water_temp_id: !secret water_temp_id
  pentair_tx_pin: GPIO17
  pentair_rx_pin: GPIO18
  right_arrow: "➡️"
  pentair_light_pin: GPIO46
  filter_pressure_pin: GPIO7   # J8 screw 1
  filter_pressure_shunt_ohms: "150.0"
  filter_pressure_full_scale_mpa: "0.5"
  acid_pump_pin: GPIO2          # Stenner 45M5 hot on CH2
  ph_sensor_pin: GPIO8          # Atlas KIT-102P 4-20 mA on J8 screw 2
  ph_shunt_ohms: "150.0"        # Dedicated 150Ω; not the Yosoo shunt; not 250Ω
  ph_scale_low: "0"             # Atlas IND-pH: 4 mA = 0 pH
  ph_scale_high: "14"           # Atlas IND-pH: 20 mA = 14 pH
  ph_offset: "0.2"              # Trim ESP/HA vs Atlas display (ESP was ~0.2 low)
  ph_update_interval: "5s"      # ADC + Pool pH poll; pH Loop Current follows voltage
  acid_pump_gpd: "25"           # Stenner output at dial 10 while CH2 is on (25 GPD model)
  # The pool Settings page shows this key. Paste it as shown.
  poolveras_authorization: !secret poolveras_authorization

esphome:
  name: pool-controller
  friendly_name: Pool Controller
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  # Device log body colors (ESPHome Builder / HA): yellow ESP→pump, cyan pump→ESP,
  # blue temp, magenta filter, green pH/acid, white schedule/lights.
  logs:
    dallas.temp.sensor: WARN

api:
  encryption:
    key: !secret pool_controller_api_key

ota:
  - platform: esphome
    id: my_ota
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Pool Controller Hotspot"
    password: !secret ap_password

captive_portal:

external_components:
  - source: github://mikedahlgren/Pool-Controller@PoolverasV1
    components: [pentair_if_ic, atlas_ezo]
    refresh: 0s

web_server:
  port: 80
  version: 3
  ota: false
  sorting_groups:
    - id: sorting_group_poolveras
      name: "PoolVeras"
      sorting_weight: -40
    - id: sorting_group_diagnostics
      name: "Diagnostics"
      sorting_weight: -1

packages:
  pool_firmware:
    url: https://github.com/mikedahlgren/Pool-Controller
    ref: PoolverasV1
    refresh: 0s
    files:
      - esphome/Include/temperature.yaml
      - esphome/Include/schedule.yaml
      - esphome/Include/pentair_light.yaml
      - esphome/Include/filter_pressure.yaml
      - esphome/Include/acid_ph.yaml
      - esphome/Include/hat.yaml
      - esphome/Include/poolveras.yaml
      # Uncomment if you add an IntelliChlor-compatible SWG, and set
      # enable_intellichlor: true in esphome/Include/schedule.yaml:
      # - esphome/Include/chlorinator.yaml

# PoolVeras (Sync to the Cloud, Last cloud sync, hourly post) is pulled from
# GitHub with the other packages above: esphome/Include/poolveras.yaml.
# secrets.yaml still needs:
#   poolveras_authorization: "pt_..."

switch:
  - platform: factory_reset
    name: Factory Reset
    web_server:
      sorting_group_id: sorting_group_diagnostics
      sorting_weight: 6
