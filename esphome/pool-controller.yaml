substitutions:
  waterfall_pin: GPIO1
  one_wire_pin: GPIO10
  air_temp_id: !secret air_temp_id
  water_temp_id: !secret water_temp_id
  pentair_tx_pin: GPIO17
  pentair_rx_pin: GPIO18
  right_arrow: "➡️"
  pentair_light_pin: GPIO46
  # Yosoo 4-20mA 0-0.5MPa filter-tank transmitter on Pico GP4 (see FILTER_PRESSURE.md)
  filter_pressure_pin: GPIO4
  filter_pressure_shunt_ohms: "150.0"
  filter_pressure_full_scale_mpa: "0.5"
  # Stenner 45M5 on CH2; Atlas Industrial pH Kit (KIT-102P) 4-wire 4-20mA on Pico GP5
  # (see ACID_PH.md). Scale is 0–14 pH for this transmitter — do not change.
  acid_pump_pin: GPIO2
  ph_sensor_pin: GPIO5
  ph_shunt_ohms: "150.0"
  ph_scale_low: "0"
  ph_scale_high: "14"

esphome:
  name: pool-controller
  friendly_name: Pool Controller
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# Enable logging
logger:
  #level: VERY_VERBOSE
  #level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret pool_controller_api_key

# Allow Over-The-Air updates
ota:
  - platform: esphome
    id: my_ota
    password: !secret pool_controller_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Pool Controller Hotspot"
    password: !secret ap_password

captive_portal:

# In-repo compile: components live at the repository root.
# For Home Assistant ESPHome Builder, copy esphome/ha-pool-controller.yaml instead
# (it pulls this same code from GitHub — no file uploads).
external_components:
  - source:
      type: local
      path: ../components
    components: [pentair_if_ic]

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: sorting_group_diagnostics
      name: "Diagnostics"
      sorting_weight: -1

packages:
  temperature: !include Include/temperature.yaml
  pump: !include Include/schedule.yaml
  pentair_light: !include Include/pentair_light.yaml
  filter_pressure: !include Include/filter_pressure.yaml
  acid_ph: !include Include/acid_ph.yaml
  # Uncomment if you add an IntelliChlor-compatible SWG, and set
  # enable_intellichlor: true in Include/schedule.yaml:
  # chlorinator: !include Include/chlorinator.yaml

switch:
  - platform: factory_reset
    name: Factory Reset/Restart
    web_server:
      sorting_group_id: sorting_group_diagnostics
      sorting_weight: 6
