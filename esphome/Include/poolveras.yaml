# Local CLI build (pool-controller.yaml) includes this file.
# Home Assistant pulls this same file from GitHub (see ha-pool-controller.yaml).
# secrets.yaml must contain the device key from the pool's Settings page:
#   poolveras_authorization: "pt_..."
# The post stores only the values included here. The site overview keeps the
# last kit reading for anything left out.

http_request:
  verify_ssl: true

text_sensor:
  - platform: template
    name: "Last cloud sync"
    id: poolveras_status
    icon: "mdi:cloud-check"
    web_server:
      sorting_group_id: sorting_group_poolveras
      sorting_weight: 2

script:
  - id: poolveras_post
    mode: single
    then:
      - lambda: |-
          id(poolveras_status).publish_state("Syncing");
      - delay: 1ms
      - if:
          condition:
            lambda: |-
              return !isnan(id(pool_ph).state) || !isnan(id(water_temperature).state);
          then:
            - logger.log:
                tag: poolveras
                format: "PoolVeras sync starting"
            - http_request.post:
                url: https://poolveras.com/api/device/readings
                request_headers:
                  Content-Type: application/json
                  Authorization: !lambda |-
                    static std::string header;
                    const std::string key = "${poolveras_authorization}";
                    if (key.size() >= 7 && (key.compare(0, 7, "Bearer ") == 0 || key.compare(0, 7, "bearer ") == 0)) header = key;
                    else header = "Bearer " + key;
                    return header.c_str();
                json: |-
                  if (!isnan(id(pool_ph).state)) root["ph"] = id(pool_ph).state;
                  if (!isnan(id(water_temperature).state)) root["tempF"] = id(water_temperature).state;
                  root["timeLabel"] = "controller";
                  auto clock = id(homeassistant_time).now();
                  if (clock.year >= 2024) {
                    std::string tested_on = clock.strftime("%Y-%m-%d");
                    root["testedOn"] = tested_on.c_str();
                    root["unix"] = (double) clock.timestamp;
                  }
                on_response:
                  then:
                    - lambda: |-
                        std::string text = "HTTP " + std::to_string(response->status_code);
                        auto clock = id(homeassistant_time).now();
                        if (clock.year >= 2024) {
                          text = clock.strftime("%H:%M ") + text;
                        }
                        id(poolveras_status).publish_state(text);
                on_error:
                  then:
                    - lambda: |-
                        id(poolveras_status).publish_state("Could not reach the site");
          else:
            - lambda: |-
                id(poolveras_status).publish_state("No pH or temperature");
            - logger.log:
                level: WARN
                tag: poolveras
                format: "PoolVeras sync skipped: pH and water temperature are unavailable"

button:
  - platform: template
    name: "Sync to the Cloud"
    id: poolveras_sync
    icon: "mdi:cloud-upload"
    on_press:
      - lambda: |-
          id(poolveras_post).execute();
    web_server:
      sorting_group_id: sorting_group_poolveras
      sorting_weight: 1

interval:
  - interval: 60min
    then:
      - lambda: |-
          id(poolveras_post).execute();
