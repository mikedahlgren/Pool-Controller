# Dallas DS18B20 temperature sensors. The chips report °C; convert here so
# Home Assistant and web_server only show Fahrenheit.
one_wire:
  - platform: gpio
    pin: ${one_wire_pin}
    id: temp_bus

sensor:
  - platform: dallas_temp
    id: air_temperature
    one_wire_id: temp_bus
    address: ${air_temp_id}
    name: Air Temperature
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: return x * 1.8f + 32.0f;
    update_interval: 120s

  - platform: dallas_temp
    id: water_temperature
    one_wire_id: temp_bus
    address: ${water_temp_id}
    name: Water Temperature
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: return x * 1.8f + 32.0f;
    update_interval: 120s
