# Local CLI build (pool-controller.yaml). Home Assistant uses the same
# section written directly in ha-pool-controller.yaml.
# secrets.yaml must contain the device key from the pool's Settings page:
#   poolvera_authorization: "pt_..."
# The post stores only the values included here. The site overview keeps the
# last kit reading for anything left out.

http_request:
  verify_ssl: true

text_sensor:
  - platform: template
    name: "Last cloud sync"
    id: poolvera_status
    icon: "mdi:cloud-check"
    web_server:
      sorting_group_id: sorting_group_poolvera
      sorting_weight: 2

script:
  - id: poolvera_post
    mode: single
    then:
      - lambda: |-
          id(poolvera_status).publish_state("Syncing");
      - delay: 1ms
      - if:
          condition:
            lambda: |-
              return !isnan(id(pool_ph).state) || !isnan(id(water_temperature).state);
          then:
            - logger.log:
                tag: poolvera
                format: "PoolVeras sync starting"
            - http_request.post:
                url: https://poolveras.com/api/device/readings
                request_headers:
                  Content-Type: application/json
                  Authorization: !lambda |-
                    static std::string header;
                    const std::string key = "${poolvera_authorization}";
                    if (key.size() >= 7 && (key.compare(0, 7, "Bearer ") == 0 || key.compare(0, 7, "bearer ") == 0)) header = key;
                    else header = "Bearer " + key;
                    return header.c_str();
                json: |-
                  if (!isnan(id(pool_ph).state)) root["ph"] = id(pool_ph).state;
                  if (!isnan(id(water_temperature).state)) root["tempF"] = id(water_temperature).state;
                  root["timeLabel"] = "controller";
                  auto clock = id(homeassistant_time).now();
                  if (clock.year >= 2024) {
                    char date_buf[11];
                    snprintf(date_buf, sizeof(date_buf), "%04d-%02d-%02d", (int) clock.year, (int) clock.month, (int) clock.day_of_month);
                    root["testedOn"] = date_buf;
                    root["unix"] = (double) clock.timestamp;
                  }
                on_response:
                  then:
                    - lambda: |-
                        std::string text = "HTTP " + std::to_string(response->status_code);
                        auto clock = id(homeassistant_time).now();
                        if (clock.year >= 2024) {
                          char when[9];
                          snprintf(when, sizeof(when), "%02d:%02d ", (int) clock.hour, (int) clock.minute);
                          text = std::string(when) + text;
                        }
                        id(poolvera_status).publish_state(text);
                on_error:
                  then:
                    - lambda: |-
                        id(poolvera_status).publish_state("Could not reach the site");
          else:
            - lambda: |-
                id(poolvera_status).publish_state("No pH or temperature");
            - logger.log:
                level: WARN
                tag: poolvera
                format: "PoolVeras sync skipped: pH and water temperature are unavailable"

button:
  - platform: template
    name: "Sync to the Cloud"
    id: poolvera_sync
    icon: "mdi:cloud-upload"
    on_press:
      - lambda: |-
          id(poolvera_post).execute();
    web_server:
      sorting_group_id: sorting_group_poolvera
      sorting_weight: 1

interval:
  - interval: 60min
    then:
      - lambda: |-
          id(poolvera_post).execute();
