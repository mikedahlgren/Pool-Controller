# Local CLI build (pool-controller.yaml). Home Assistant uses the same
# section written directly in ha-pool-controller.yaml, so the file you paste
# into ESPHome Builder shows PoolVera without depending on this download.
# secrets.yaml must contain the device key from the pool's Settings page:
#   poolvera_authorization: "pt_..."
# A measurement left out of the post keeps the last value already on the site.

http_request:
  verify_ssl: true

script:
  - id: poolvera_post
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !isnan(id(pool_ph).state) || !isnan(id(water_temperature).state);
          then:
            - logger.log:
                tag: poolvera
                format: "PoolVera sync starting"
            - http_request.post:
                url: https://pool-tracker-web.vercel.app/api/device/readings
                request_headers:
                  Content-Type: application/json
                  Authorization: !lambda |-
                    static std::string header;
                    const std::string key = "${poolvera_authorization}";
                    if (key.size() >= 7 && (key.compare(0, 7, "Bearer ") == 0 || key.compare(0, 7, "bearer ") == 0)) header = key;
                    else header = "Bearer " + key;
                    return header.c_str();
                json: |-
                  if (!isnan(id(pool_ph).state)) root["ph"] = id(pool_ph).state;
                  if (!isnan(id(water_temperature).state)) root["tempF"] = id(water_temperature).state;
                  root["timeLabel"] = "controller";
          else:
            - logger.log:
                level: WARN
                tag: poolvera
                format: "PoolVera sync skipped: pH and water temperature are unavailable"

button:
  - platform: template
    name: "Sync to the Cloud"
    id: poolvera_sync
    icon: "mdi:cloud-upload"
    on_press:
      - script.execute: poolvera_post
    web_server:
      sorting_group_id: sorting_group_poolvera
      sorting_weight: 1

interval:
  - interval: 60min
    then:
      - script.execute: poolvera_post
